name: ios-probe

on:
  push:
    # `rebuild-step3` is the branch the project was restarted on: it starts
    # from the step-3 baseline and does not take the step 4-8 code. Building
    # it from CI keeps device validation independent of whatever is on main.
    branches: [main, rebuild-step3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    # video_player_avfoundation 2.12.3 uses Swift 6.2 concurrency APIs
    # (`isolation:` argument), which Xcode 16.4's Swift 6.0/6.1 rejects.
    # Xcode 26 still supports iOS 15.0+ deployment targets, so 15.2 is safe.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Host, Xcode and CocoaPods versions
        run: |
          set -o pipefail
          mkdir -p ci-report
          sw_vers | tee ci-report/macos.txt
          ls -d /Applications/Xcode*.app 2>/dev/null | tee ci-report/xcode-apps.txt || true
          xcodebuild -version | tee ci-report/xcode.txt
          xcode-select -p | tee -a ci-report/xcode.txt
          swift --version | tee ci-report/swift.txt
          xcrun --sdk iphoneos --show-sdk-version | tee ci-report/iphoneos-sdk.txt
          (pod --version 2>&1 || echo "cocoapods-missing") | tee ci-report/cocoapods.txt

      - name: Assert toolchain is Xcode 26 or newer
        run: |
          set -o pipefail
          # Do not pipe xcodebuild into `head`: head closes the pipe after one
          # line, xcodebuild takes SIGPIPE while writing its banner and aborts
          # with NSFileHandleOperationException, which surfaces as exit 134.
          # Capture the whole banner first, then parse it.
          xcode_banner="$(xcodebuild -version 2>/dev/null || true)"
          printf '%s\n' "${xcode_banner}"
          major="$(printf '%s\n' "${xcode_banner}" | sed -n '1s/^Xcode //p' | cut -d. -f1)"
          echo "detected Xcode major: ${major}"
          if ! [[ "${major}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: could not read the Xcode version from: ${xcode_banner}" >&2
            exit 1
          fi
          if [[ "${major}" -lt 26 ]]; then
            newest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [[ -n "${newest}" ]]; then
              echo "switching to ${newest}"
              sudo xcode-select -s "${newest}"
              xcodebuild -version
            else
              echo "ERROR: Xcode >= 26 not available; video_player_avfoundation cannot compile" >&2
              exit 1
            fi
          fi

      - name: Install CocoaPods if the image lacks it
        run: |
          set -o pipefail
          if ! pod --version >/dev/null 2>&1; then
            gem install cocoapods --no-document 2>&1 | tail -5
          fi
          pod --version

      - name: Install Flutter 3.47.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          set -o pipefail
          flutter --version | tee ci-report/flutter.txt
          flutter doctor -v | tee ci-report/doctor.txt || true

      - name: Cache TDLib xcframework
        uses: actions/cache@v4
        with:
          path: ~/tdlib-cache
          key: tdlib-1.8.69-025086e3-371840147

      - name: Fetch, checksum and unpack TDLib xcframework
        run: |
          set -o pipefail
          ./scripts/fetch_tdlib.sh 2>&1 | tee ci-report/fetch-tdlib.txt

      - name: Assert xcframework layout and minimum OS
        run: |
          set -o pipefail
          {
            echo "--- xcframework root"
            ls -la ios/tdlib/TDLibFramework.xcframework
            echo "--- ios-arm64 slice"
            ls -la ios/tdlib/TDLibFramework.xcframework/ios-arm64/TDLibFramework.framework
            echo "--- framework Info.plist"
            /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" \
              ios/tdlib/TDLibFramework.xcframework/ios-arm64/TDLibFramework.framework/Info.plist
            echo "--- binary kind"
            head -c 8 ios/tdlib/TDLibFramework.xcframework/ios-arm64/TDLibFramework.framework/TDLibFramework
            echo
            echo "--- tdjson entry points declared in the public header"
            grep -E "TDJSON_EXPORT" \
              ios/tdlib/TDLibFramework.xcframework/ios-arm64/TDLibFramework.framework/Headers/td_json_client.h
          } 2>&1 | tee ci-report/tdlib-layout.txt
          test -f ios/tdlib/TDLibFramework.xcframework/ios-arm64/TDLibFramework.framework/TDLibFramework

      - name: Fetch TDLib schema fixture
        run: |
          set -o pipefail
          mkdir -p test/fixtures
          curl -sSL --retry 3 -o test/fixtures/td_api.tl \
            https://raw.githubusercontent.com/tdlib/td/master/td/generate/scheme/td_api.tl
          wc -l test/fixtures/td_api.tl | tee ci-report/td_api_schema.txt

      - name: Pub get
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ci-report/pub-get.txt

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ci-report/analyze.txt

      - name: Unit tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee ci-report/test.txt

      - name: Pod install (own log so pod failures are not buried in xcodebuild output)
        run: |
          set -o pipefail
          cd ios
          pod install --repo-update 2>&1 | tee ../ci-report/pod-install.txt
          echo "--- pinned deployment targets"
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" Runner.xcodeproj/project.pbxproj | tee ../ci-report/deployment-targets.txt
          echo "--- tdlib in Podfile.lock"
          grep -n -A6 "tdlib" Podfile.lock | tee ../ci-report/podfile-lock-tdlib.txt
          echo "--- Pods xcconfig is actually included by Runner"
          grep -n "Pods-Runner" Flutter/Debug.xcconfig Flutter/Release.xcconfig | tee ../ci-report/xcconfig-include.txt
          echo "--- linker flags that keep tdjson.o alive"
          grep -rn "td_create_client_id\|td_send\|td_receive\|td_execute" "Pods/Target Support Files/Pods-Runner/" | tee ../ci-report/linker-flags.txt
          for sym in td_create_client_id td_send td_receive td_execute; do
            if ! grep -rq "\-u,_${sym}" "Pods/Target Support Files/Pods-Runner/"; then
              echo "ERROR: -u,_${sym} never reached the Runner xcconfig" >&2
              exit 1
            fi
          done

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ci-report/build-ios.txt

      - name: Inspect linked binary (TDLib symbol proof)
        run: |
          set -o pipefail
          ./scripts/inspect_binary.sh 2>&1 | tee ci-report/inspect.txt

      - name: Package unsigned IPA
        if: success()
        run: |
          set -o pipefail
          ./scripts/make_unsigned_ipa.sh 2>&1 | tee ci-report/package.txt

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tg-media-probe-ipa
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/sha256.txt
            ci-report/*.txt
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-failure
          path: ci-report/
          retention-days: 14

      - name: Publish diagnostics branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish_report.sh
